name: FormFlow AI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements-test.txt
      - name: Install pinned backend requirements
        run: python -m pip install -r apps/api/requirements-test.txt
      - name: Compile backend
        run: python -m compileall -q apps/api/app apps/extractor
      - name: Test API, COI schema, generic extraction and legacy DOC wrapper
        env:
          PYTHONPATH: apps/api
          FORMFLOW_AI_PROVIDER: disabled
        run: python -m pytest -q -p no:cacheprovider apps/api/tests

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend from lockfile
        run: npm ci --ignore-scripts
      - name: Test JSON Forms adapter and editor
        run: npm test
      - name: Build preview
        run: npm run build