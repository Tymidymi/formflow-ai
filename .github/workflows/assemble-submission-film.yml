name: Assemble verified FormFlow contest video
on:
  push:
    paths:
      - "submission/.video-chunks/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble and verify MP4
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(submission/.video-chunks/part-???)
          test "${#parts[@]}" -eq 19
          cat "${parts[@]}" > submission/FormFlow_AI_HackNation_2026_FullHD_v2.mp4
          echo "534a8e8ea9494d5ce7515a1d47777cb5e30875fc17ef8661cd277e48452f2bf4  submission/FormFlow_AI_HackNation_2026_FullHD_v2.mp4" | sha256sum -c -
          test "$(stat -c %s submission/FormFlow_AI_HackNation_2026_FullHD_v2.mp4)" -eq 9091353
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 submission/FormFlow_AI_HackNation_2026_FullHD_v2.mp4 | grep -qx '1920,1080'
      - name: Commit finished film and remove temporary parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r submission/.video-chunks
          git add submission/FormFlow_AI_HackNation_2026_FullHD_v2.mp4
          git commit -m "docs(submission): publish verified Full HD FormFlow film"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
