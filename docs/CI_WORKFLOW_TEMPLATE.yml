name: FormFlow AI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements-test.txt
      - name: Install pinned dependencies
        run: python -m pip install -r apps/api/requirements-test.txt
      - name: Compile API
        run: python -m compileall -q apps/api/app
      - name: Run contract and API tests
        env:
          PYTHONPATH: apps/api
          FORMFLOW_AI_PROVIDER: disabled
        run: python -m pytest -q -p no:cacheprovider apps/api/tests
