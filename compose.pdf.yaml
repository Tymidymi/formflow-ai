# Optional PDF/OCR worker. Runs offline in a private Docker network.
# Requires compose.docling.yaml for the shared extractor_private network.
services:
  api:
    environment:
      FORMFLOW_PDF_WORKER_URL: http://pdf-engine:8002
      FORMFLOW_PDF_VISION: "${FORMFLOW_PDF_VISION:-false}"
  pdf-engine:
    profiles: ["pdf"]
    build:
      context: .
      dockerfile: apps/pdf_engine/Dockerfile
    image: formflow-pdf-engine:0.6.0
    restart: "on-failure:3"
    init: true
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=80m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 48
    mem_limit: 384m
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    networks:
      - extractor_private
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
